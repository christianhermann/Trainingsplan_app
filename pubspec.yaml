name: trainingsplan_app
description: "A Flutter app for managing structured strength training programs."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.3.0

  # Local persistence
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.8.0
  path_provider: ^2.1.0

  # UI
  google_fonts: ^8.1.0

  # Utilities
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
