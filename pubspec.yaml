name: trainingsplan_app
description: "A Flutter app for managing structured strength training programs."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Local persistence
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.8.0
  path_provider: ^2.1.0

  # UI
  google_fonts: ^6.1.0

  # Utilities
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
